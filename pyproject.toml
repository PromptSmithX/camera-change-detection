[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "change-detection-v2"
version = "0.1.0"
description = "Fixed-camera change detection contracts, sources, calibration, and evaluation foundation."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "numpy>=2.0",
  "opencv-python>=4.10",
]
runtime = [
  "numpy>=2.0",
  "opencv-python>=4.10",
]
perception = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "ultralytics>=8.3,<9",
  "supervision>=0.24,<0.31",
]
identity = [
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "scipy>=1.13,<2",
]
review = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "Pillow>=10.0",
  "numpy>=2.0",
  "opencv-python>=4.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
